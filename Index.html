
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brayan AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101116;
  color: white;
  font-family: Arial;
}

header {
  height: 70px;
  background: #191a22;
  display: flex;
  align-items: center;
  padding: 15px;
  gap: 12px;
}

.logo {
  background: #7857ff;
  padding: 12px;
  border-radius: 13px;
  font-size: 23px;
}

header h2 { margin: 0; }
header small { color: #aaa; }

#chat {
  height: calc(100dvh - 145px);
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg {
  max-width: 85%;
  padding: 13px;
  border-radius: 15px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.5;
}

.bot {
  background: #252631;
  align-self: flex-start;
}

.user {
  background: #7857ff;
  align-self: flex-end;
}

#boasVindas {
  text-align: center;
  margin: auto;
  color: #ccc;
}

footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 12px;
  background: #191a22;
  border-top: 1px solid #333;
}

form {
  display: flex;
  gap: 9px;
}

input {
  flex: 1;
  min-width: 0;
  height: 50px;
  border: 1px solid #444;
  background: #292a35;
  color: white;
  border-radius: 14px;
  padding: 12px;
  font-size: 16px;
}

button {
  width: 52px;
  height: 50px;
  border: none;
  border-radius: 14px;
  background: #7857ff;
  color: white;
  font-size: 24px;
}

button:disabled { opacity: .5; }
</style>
</head>

<body>

<header>
  <div class="logo">🤖</div>
  <div>
    <h2>Brayan AI</h2>
    <small>Sua inteligência artificial</small>
  </div>
</header>

<div id="chat">
  <div id="boasVindas">
    <h1>Olá! 👋</h1>
    <p>Sou a Brayan AI. Como posso ajudar?</p>
  </div>
</div>

<footer>
  <form id="form">
    <input
      id="message"
      type="text"
      placeholder="Pergunte alguma coisa..."
      autocomplete="off"
      required
    >
    <button id="send" type="submit">➤</button>
  </form>
</footer>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("message");
const send = document.getElementById("send");

let history = [];

function addMessage(text, type) {
  const welcome = document.getElementById("boasVindas");
  if (welcome) welcome.remove();

  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  return div;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const text = input.value.trim();
  if (!text || send.disabled) return;

  addMessage(text, "user");
  input.value = "";
  send.disabled = true;

  const loading = addMessage("Pensando...", "bot");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: [...history, {
          role: "user",
          content: text
        }]
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Erro no servidor");
    }

    loading.textContent = data.reply;

    history.push(
      { role: "user", content: text },
      { role: "assistant", content: data.reply }
    );

  } catch (error) {
    loading.textContent = "nao consigui data.";
  }

  send.disabled = false;
  input.focus();
});
</script>

</body>
</html>
